name: Build and Deploy Web.Api

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT: Web.Api/Web.Api.csproj
  PUBLISH_DIR: publish
  DEPLOY_PATH: /var/www/attaa-backend

jobs:
  build-deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .NET installation
        run: |
          if command -v dotnet >/dev/null 2>&1; then
            echo "✓ .NET is already installed"
            dotnet --version
          else
            echo "✗ .NET is not installed"
            echo "Please install .NET 8.0 on your runner server"
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore ./Ataa-BackEnd.sln

      - name: Build solution
        run: dotnet build ./Ataa-BackEnd.sln -c Release --no-restore

      - name: Publish Web.Api
        run: dotnet publish $PROJECT -c Release -o $PUBLISH_DIR

      - name: List published files
        run: ls -la $PUBLISH_DIR

      - name: Stop existing service
        run: |
          echo "Stopping existing service..."
          sudo systemctl stop attaa-backend || true
          sleep 5
          echo "Service stopped"

      - name: Wait for file locks to release
        run: |
          echo "Waiting for file locks to release..."
          sleep 10
          echo "Ready to deploy"

      - name: Backup existing wwwroot
        run: |
          if [ -d "$DEPLOY_PATH/wwwroot" ]; then
            echo "Backing up existing wwwroot folder..."
            sudo cp -r $DEPLOY_PATH/wwwroot /tmp/wwwroot_backup
            echo "wwwroot backed up to /tmp/wwwroot_backup"
          else
            echo "No existing wwwroot folder found"
          fi

      - name: Deploy files
        run: |
          sudo rm -rf $DEPLOY_PATH
          sudo mkdir -p $DEPLOY_PATH
          sudo cp -r $PUBLISH_DIR/* $DEPLOY_PATH/
          sudo chown -R $USER:$USER $DEPLOY_PATH
          echo "Files deployed to $DEPLOY_PATH"

      - name: Restore wwwroot
        run: |
          if [ -d "/tmp/wwwroot_backup" ]; then
            echo "Restoring wwwroot folder..."
            sudo cp -r /tmp/wwwroot_backup $DEPLOY_PATH/wwwroot
            sudo chown -R $USER:$USER $DEPLOY_PATH/wwwroot
            # copy the files from wwwroot_backup to wwwroot and delete the wwwroot_backup
            sudo cp -r /tmp/wwwroot_backup/* $DEPLOY_PATH/wwwroot/
            sudo rm -rf /tmp/wwwroot_backup
            echo "wwwroot folder restored"
          else
            echo "No wwwroot backup found, keeping new wwwroot"
          fi

      - name: List deployed files
        run: ls -la $DEPLOY_PATH

      - name: Set proper permissions for file uploads
        run: |
          echo "Setting permissions for file uploads..."
          # Ensure the application user can write to wwwroot and its subdirectories
          sudo chown -R $USER:$USER $DEPLOY_PATH/wwwroot
          sudo chmod -R 755 $DEPLOY_PATH/wwwroot
          # Create Courses directory if it doesn't exist and set proper permissions
          sudo mkdir -p $DEPLOY_PATH/wwwroot/Courses
          sudo chown -R $USER:$USER $DEPLOY_PATH/wwwroot/Courses
          sudo chmod -R 755 $DEPLOY_PATH/wwwroot/Courses
          echo "Permissions set successfully"

      - name: Create systemd service for HTTP and HTTPS
        run: |
          sudo tee /etc/systemd/system/attaa-backend.service > /dev/null <<EOF
          [Unit]
          Description=Coding With Us API
          After=network.target

          [Service]
          Type=exec
          User=$USER
          WorkingDirectory=$DEPLOY_PATH
          ExecStart=/usr/bin/dotnet $DEPLOY_PATH/Web.Api.dll
          Restart=always
          RestartSec=10
          Environment=ASPNETCORE_URLS=http://0.0.0.0:5164;https://0.0.0.0:7096
          Environment=DOTNET_ENVIRONMENT=Production

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Enable and start service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl enable attaa-backend
          sudo systemctl start attaa-backend

      - name: Check service status
        run: |
          sudo systemctl status attaa-backend --no-pager || true

      - name: Wait for service to be ready
        run: |
          echo "Waiting for service to start..."
          sleep 15
          for i in {1..30}; do
            if curl -f http://localhost:5164/health > /dev/null 2>&1 && curl -k -f https://localhost:7096/health > /dev/null 2>&1; then
              echo "Service is ready on both HTTP and HTTPS!"
              break
            fi
            echo "Attempt $i: Service not ready yet, waiting..."
            sleep 5
          done

      - name: Health check
        run: |
          echo "Testing HTTP endpoint..."
          if curl -f http://localhost:5164/health; then
            echo "✅ HTTP health check passed"
          else
            echo "❌ HTTP health check failed"
            exit 1
          fi
          
          echo "Testing HTTPS endpoint..."
          if curl -k -f https://localhost:7096/health; then
            echo "✅ HTTPS health check passed"
          else
            echo "❌ HTTPS health check failed"
            exit 1
          fi
          
          echo "🎉 All health checks passed!"